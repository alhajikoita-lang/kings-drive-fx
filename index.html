<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07080a"><title>KINGS DRIVE FX</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand">KINGS <span>DRIVE FX</span><small>V2 SYNTH ENGINE</small></div><div><span id="audio" class="status">AUDIO OFF</span><span id="gps" class="status">GPS OFF</span></div></header><section class="dash"><div class="side"><small>GEAR</small><b id="gear">P</b></div><div class="speed"><b id="speed">0</b><small>MPH</small></div><div class="tach"><span id="rpmbar"></span></div><div class="rpmtext"><b id="rpm">800</b><small>RPM</small></div><div id="shift" class="shift">SHIFT</div></section><section class="controls"><div class="modes" id="modes"></div><div class="buttons"><button id="power">POWER SOUND</button><button id="start">START GPS DRIVE</button><button id="manual">MANUAL TEST</button></div><div id="throttleWrap" class="panel hidden"><label>VIRTUAL ACCELERATOR <span id="throttleVal">0%</span></label><input id="throttle" type="range" min="0" max="100" value="0"></div><div class="panel grid"><label>MASTER VOLUME <span id="volumeVal">65%</span><input id="volume" type="range" min="0" max="100" value="65"></label><label>ENGINE INTENSITY <span id="intensityVal">75%</span><input id="intensity" type="range" min="20" max="100" value="75"></label></div><div class="readout"><span>MODE <b id="modeName">V8</b></span><span>ENGINE <b id="engineState">IDLE</b></span><span>INPUT <b id="inputState">STANDBY</b></span></div></section><footer>Set up while parked. This prototype uses browser generated audio and does not interact with Tesla vehicle controls or pedestrian warning hardware.</footer></main><script src="app.js"></script></body></html>
