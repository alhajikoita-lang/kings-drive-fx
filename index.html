<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><meta name='theme-color' content='#08090b'><title>KINGS DRIVE FX</title><link rel='stylesheet' href='style.css'></head><body><main><header><div class='brand'>KINGS <span>DRIVE FX</span></div><div id='gps' class='status'>GPS OFF</div></header><section class='dash'><div class='gear'><small>GEAR</small><b id='gear'>P</b></div><div class='speed'><b id='speed'>0</b><small>MPH</small></div><div class='rpm'><span id='rpmbar'></span></div><div class='rpmtext'><b id='rpm'>800</b><small>RPM</small></div></section><section class='controls'><div class='modes' id='modes'></div><div class='buttons'><button id='start'>START DRIVE</button><button id='manual'>MANUAL TEST</button></div><div id='throttleWrap' class='throttle hidden'><label>THROTTLE <span id='throttleVal'>0%</span></label><input id='throttle' type='range' min='0' max='100' value='0'></div><label class='volume'>VOLUME <input id='volume' type='range' min='0' max='100' value='65'></label></section><footer>Complete setup while parked. GPS availability depends on the vehicle browser.</footer></main><script src='app.js'></script></body></html>
